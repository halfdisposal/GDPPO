<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    
    <linearGradient id="primary-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="bound-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#30363d" stroke-width="4"/>

  <!-- PPO Clipping Bounds (Outer Dashed Guidance Layer) -->
  <path d="M 120 360 C 180 280, 220 320, 280 200 C 320 120, 360 150, 400 120" 
        fill="none" stroke="url(#bound-glow)" stroke-width="8" stroke-dasharray="12 12" stroke-linecap="round" opacity="0.4"/>
  
  <path d="M 110 400 C 170 320, 210 360, 270 240 C 310 160, 350 190, 390 160" 
        fill="none" stroke="url(#bound-glow)" stroke-width="8" stroke-dasharray="12 12" stroke-linecap="round" opacity="0.4"/>

  <!-- Core Policy Optimization Trajectory (Glowing Arc & Arrow) -->
  <g filter="url(#shadow)">
    <path d="M 115 380 C 175 300, 215 340, 275 220 C 315 140, 345 160, 385 130" 
          fill="none" stroke="url(#primary-glow)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Directional Vector Head -->
    <path d="M 360 115 L 405 125 L 390 170 Z" fill="url(#primary-glow)"/>
  </g>

  <!-- RL State Nodes -->
  <circle cx="115" cy="380" r="14" fill="#0d1117" stroke="url(#primary-glow)" stroke-width="8"/>
  <circle cx="275" cy="220" r="10" fill="#0d1117" stroke="url(#primary-glow)" stroke-width="6"/>
  <circle cx="395" cy="135" r="16" fill="#00f2fe"/>
</svg>
